---
name: Dependabot Automerge

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    name: Dependabot Automerge
    uses: miikkak/workflows/.github/workflows/dependabot-automerge.yml@e1de600c281bb249cfd9c6b2bb3030a2f1ac40b6 # main
    secrets:
      PULL_REQUEST_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
